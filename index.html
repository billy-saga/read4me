<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Read4Me</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --bg: #0e0e10; --surface: #18181c; --surface2: #222228;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
    --text: #f0f0f2; --muted: #8a8a96; --accent: #5ee3b0;
    --accent-dim: rgba(94,227,176,0.12); --danger: #ff6b6b;
    --radius: 12px; --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem 4rem; }
  header { text-align: center; margin-bottom: 2rem; }
  .logo { font-size: 28px; font-weight: 700; color: var(--text); }
  .logo span { color: var(--accent); }
  .tagline { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; width: 100%; max-width: 580px; margin-bottom: 1rem; }

  /* Setup screen */
  .setup { text-align: center; padding: 0.5rem 0 0.25rem; }
  .setup-title { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
  .setup-sub { font-size: 13px; color: var(--muted); margin-bottom: 1.25rem; }
  .setup-row { display: flex; gap: 8px; }
  .setup-row input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 14px; padding: 9px 12px; outline: none; }
  .setup-row input:focus { border-color: var(--accent); }
  .btn-save { padding: 9px 18px; border-radius: var(--radius-sm); border: none; background: var(--accent); color: #0a1a12; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn-save:hover { opacity: 0.88; }

  /* Main app */
  .app { display: none; }
  .app.visible { display: block; }
  .tabs { display: flex; gap: 6px; margin-bottom: 1rem; }
  .tab { flex: 1; padding: 9px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .tab.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .tab:hover:not(.active) { border-color: var(--border2); color: var(--text); }
  .mode { display: none; }
  .mode.active { display: block; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 5px; letter-spacing: 0.04em; text-transform: uppercase; }
  input[type="text"] { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 14px; padding: 9px 12px; outline: none; transition: border-color 0.15s; }
  input[type="text"]:focus { border-color: var(--accent); }
  .field { margin-bottom: 0.85rem; }
  .drop-zone { border: 1.5px dashed var(--border2); border-radius: var(--radius-sm); padding: 2rem 1rem; text-align: center; cursor: pointer; transition: all 0.15s; position: relative; }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: var(--accent-dim); }
  .drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .drop-label { font-size: 14px; color: var(--muted); }
  .drop-label strong { color: var(--text); }
  .file-name { font-size: 13px; color: var(--accent); margin-top: 6px; font-weight: 500; }
  .btn-primary { width: 100%; padding: 11px; border-radius: var(--radius-sm); border: none; background: var(--accent); color: #0a1a12; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; margin-top: 0.75rem; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
  .preview-box { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; font-size: 13px; color: var(--muted); line-height: 1.65; max-height: 120px; overflow-y: auto; margin-top: 0.75rem; display: none; white-space: pre-wrap; word-break: break-word; }
  .preview-box.visible { display: block; }
  .status { font-size: 13px; color: var(--muted); text-align: center; margin-top: 0.75rem; min-height: 20px; }
  .status.error { color: var(--danger); }
  .status.success { color: var(--accent); }
  .progress-wrap { margin-top: 10px; display: none; }
  .progress-wrap.visible { display: block; }
  .progress-label { font-size: 12px; color: var(--muted); margin-bottom: 5px; text-align: center; }
  .progress-bar { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; width: 0%; transition: width 0.3s; }
  .player { display: none; }
  .player.visible { display: block; }
  .player-inner { background: var(--surface2); border-radius: var(--radius-sm); padding: 1rem; margin-top: 0.75rem; }
  .player-title { font-size: 13px; color: var(--muted); margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  audio { width: 100%; margin-bottom: 8px; }
  .player-footer { display: flex; align-items: center; justify-content: space-between; }
  .btn-download { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); background: transparent; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px 10px; cursor: pointer; transition: all 0.15s; text-decoration: none; }
  .btn-download:hover { border-color: var(--border2); color: var(--text); }
  .btn-reset-key { font-size: 11px; color: var(--muted); background: transparent; border: none; cursor: pointer; text-decoration: underline; padding: 0; }
  .btn-reset-key:hover { color: var(--text); }
</style>
</head>
<body>

<header>
  <div class="logo">read<span>4</span>me</div>
  <div class="tagline">PDF ou URL → áudio com voz neural</div>
</header>

<!-- Setup (primeira vez) -->
<div class="card" id="setupCard">
  <div class="setup">
    <div class="setup-title">Configure sua chave Azure TTS</div>
    <div class="setup-sub">Cole sua API Key abaixo. Ela fica salva só neste dispositivo.</div>
    <div class="setup-row">
      <input type="password" id="setupKey" placeholder="Cole sua Azure API Key aqui" />
      <button class="btn-save" id="btnSaveKey">Salvar</button>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px;">Região: brazilsouth · Voz: Brenda Neural</div>
  </div>
</div>

<!-- App principal -->
<div class="card app" id="appCard">
  <div class="tabs">
    <button class="tab active" data-mode="url">🔗 URL</button>
    <button class="tab" data-mode="pdf">📄 PDF</button>
  </div>

  <div class="mode active" id="mode-url">
    <div class="field">
      <label>Endereço da página</label>
      <input type="text" id="urlInput" placeholder="https://exemplo.com/artigo" />
    </div>
    <div class="preview-box" id="urlPreview"></div>
    <button class="btn-primary" id="btnUrl">🎙️ Gerar áudio da URL</button>
  </div>

  <div class="mode" id="mode-pdf">
    <div class="drop-zone" id="dropZone">
      <input type="file" id="pdfInput" accept=".pdf" />
      <div class="drop-label"><strong>Clique para selecionar</strong> ou arraste o PDF aqui</div>
      <div class="file-name" id="fileName"></div>
    </div>
    <div class="preview-box" id="pdfPreview"></div>
    <button class="btn-primary" id="btnPdf" disabled>🎙️ Gerar áudio do PDF</button>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-label" id="progressLabel">Processando...</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="status" id="status"></div>

  <div class="player" id="player">
    <div class="player-inner">
      <div class="player-title" id="playerTitle">—</div>
      <audio id="audioPlayer" controls preload="auto"></audio>
      <div class="player-footer">
        <a class="btn-download" id="downloadBtn" href="#" download="read4me.wav">⬇ Baixar WAV</a>
        <button class="btn-reset-key" id="btnResetKey">trocar chave</button>
      </div>
    </div>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

var $ = function(id) { return document.getElementById(id); };
var pdfText = '', pdfFile = null, currentBlobUrl = null;
var TTS_REGION = 'brazilsouth';
var TTS_VOICE  = 'pt-BR-BrendaNeural';

// --- Setup / key management ---
function getKey() { return localStorage.getItem('r4m_key') || ''; }

function showSetup() {
  $('setupCard').style.display = 'block';
  $('appCard').classList.remove('visible');
}
function showApp() {
  $('setupCard').style.display = 'none';
  $('appCard').classList.add('visible');
}

if (getKey()) { showApp(); } else { showSetup(); }

$('btnSaveKey').onclick = function() {
  var key = $('setupKey').value.trim();
  if (!key) return;
  localStorage.setItem('r4m_key', key);
  showApp();
};
$('setupKey').addEventListener('keydown', function(e) { if (e.key === 'Enter') $('btnSaveKey').click(); });

$('btnResetKey').onclick = function() {
  localStorage.removeItem('r4m_key');
  $('setupKey').value = '';
  hidePlayer(); setStatus('');
  showSetup();
};

// --- Tabs ---
document.querySelectorAll('.tab').forEach(function(tab) {
  tab.onclick = function() {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.mode').forEach(function(m) { m.classList.remove('active'); });
    tab.classList.add('active');
    $('mode-' + tab.dataset.mode).classList.add('active');
    setStatus(''); hidePlayer();
  };
});

function setStatus(msg, type) {
  $('status').textContent = msg || '';
  $('status').className = 'status' + (type ? ' ' + type : '');
}
function setProgress(pct, label) {
  $('progressWrap').classList.toggle('visible', pct > 0 && pct <= 100);
  $('progressFill').style.width = pct + '%';
  if (label) $('progressLabel').textContent = label;
}
function hidePlayer() {
  $('player').classList.remove('visible');
  $('audioPlayer').pause();
  if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
  $('audioPlayer').src = '';
}
function showPlayer(blob, title) {
  if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
  currentBlobUrl = URL.createObjectURL(blob);
  $('audioPlayer').src = currentBlobUrl;
  $('playerTitle').textContent = title;
  $('downloadBtn').href = currentBlobUrl;
  $('downloadBtn').download = title.replace(/\.[^.]+$/, '') + '.wav';
  $('player').classList.add('visible');
}

// --- PDF ---
var dropZone = $('dropZone');
dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('dragover'); });
dropZone.addEventListener('drop', function(e) { e.preventDefault(); dropZone.classList.remove('dragover'); handlePdf(e.dataTransfer.files[0]); });
$('pdfInput').onchange = function(e) { handlePdf(e.target.files[0]); };

async function handlePdf(file) {
  if (!file || file.type !== 'application/pdf') return;
  pdfFile = file; $('fileName').textContent = file.name; setStatus('Extraindo texto...');
  try {
    var pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    var text = '';
    for (var i = 1; i <= pdf.numPages; i++) {
      var content = await (await pdf.getPage(i)).getTextContent();
      text += content.items.map(function(s) { return s.str; }).join(' ') + '\n';
    }
    pdfText = text.trim();
    $('pdfPreview').textContent = pdfText.slice(0,500) + (pdfText.length>500?'...':'');
    $('pdfPreview').classList.add('visible');
    $('btnPdf').disabled = false;
    setStatus(pdf.numPages + ' página(s) — ' + pdfText.length.toLocaleString() + ' caracteres', 'success');
  } catch(e) { setStatus('Erro ao ler PDF: ' + e.message, 'error'); }
}

$('urlInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') $('btnUrl').click(); });
$('btnUrl').onclick = async function() {
  var url = $('urlInput').value.trim();
  if (!url) return setStatus('Informe uma URL.', 'error');
  setStatus('Buscando conteúdo...'); hidePlayer(); setProgress(0);
  try {
    var data = await (await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(url))).json();
    var doc = new DOMParser().parseFromString(data.contents, 'text/html');
    ['script','style','nav','footer','header','aside','noscript'].forEach(function(tag) {
      doc.querySelectorAll(tag).forEach(function(el) { el.remove(); });
    });
    var el = doc.querySelector('article') || doc.querySelector('main') || doc.body;
    var text = (el?el.textContent:doc.body.textContent).replace(/\s+/g,' ').trim();
    if (text.length < 100) throw new Error('Conteúdo muito curto ou bloqueado pelo site.');
    $('urlPreview').textContent = text.slice(0,500)+(text.length>500?'...':'');
    $('urlPreview').classList.add('visible');
    await generateAudio(text, new URL(url).hostname);
  } catch(e) { setStatus('Erro: ' + e.message, 'error'); setProgress(0); }
};
$('btnPdf').onclick = async function() {
  if (!pdfText) return;
  await generateAudio(pdfText, pdfFile ? pdfFile.name : 'documento.pdf');
};

// --- TTS ---
function chunkText(text) {
  var size=2800, chunks=[], i=0;
  while (i < text.length) {
    var end = Math.min(i+size, text.length);
    if (end < text.length) { var dot=text.lastIndexOf('.',end); if(dot>i+300) end=dot+1; }
    var chunk=text.slice(i,end).trim();
    if (chunk.length>0) chunks.push(chunk);
    i=end;
  }
  return chunks;
}

async function ttsChunk(text, key) {
  var escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  var ssml = "<speak version='1.0' xml:lang='pt-BR'><voice name='"+TTS_VOICE+"'>"+escaped+"</voice></speak>";
  var res = await fetch('https://'+TTS_REGION+'.tts.speech.microsoft.com/cognitiveservices/v1', {
    method:'POST',
    headers:{ 'Ocp-Apim-Subscription-Key':key, 'Content-Type':'application/ssml+xml', 'X-Microsoft-OutputFormat':'riff-16khz-16bit-mono-pcm' },
    body:ssml
  });
  if (!res.ok) { var err=await res.text(); throw new Error('Azure TTS erro '+res.status+': '+err.slice(0,200)); }
  return await res.arrayBuffer();
}

function findDataOffset(bytes) {
  for (var i=12;i<bytes.length-8;i++)
    if(bytes[i]===100&&bytes[i+1]===97&&bytes[i+2]===116&&bytes[i+3]===97) return i+8;
  return 44;
}

function mergeWavBuffers(buffers) {
  var arrays = buffers.map(function(b){return new Uint8Array(b);});
  var dataOffset = findDataOffset(arrays[0]);
  var header = arrays[0].slice(0, dataOffset);
  var pcms = arrays.map(function(a){return a.slice(dataOffset);});
  var totalPcm = pcms.reduce(function(s,p){return s+p.byteLength;},0);
  var out = new Uint8Array(dataOffset+totalPcm);
  out.set(header,0);
  var off=dataOffset;
  for(var i=0;i<pcms.length;i++){out.set(pcms[i],off);off+=pcms[i].byteLength;}
  var dv=new DataView(out.buffer);
  dv.setUint32(4, out.byteLength-8, true);
  dv.setUint32(dataOffset-4, totalPcm, true);
  return out.buffer;
}

async function generateAudio(text, title) {
  var key = getKey();
  if (!key) return showSetup();
  $('btnUrl').disabled=true; $('btnPdf').disabled=true; hidePlayer();
  var chunks=chunkText(text), buffers=[];
  try {
    for(var i=0;i<chunks.length;i++){
      setProgress(Math.round(((i+1)/chunks.length)*100),'Gerando áudio... parte '+(i+1)+' de '+chunks.length);
      buffers.push(await ttsChunk(chunks[i],key));
    }
    setProgress(100,'Finalizando...');
    var merged=mergeWavBuffers(buffers);
    var blob=new Blob([merged],{type:'audio/wav'});
    setProgress(0);
    setStatus('Pronto! '+(blob.size/1024/1024).toFixed(2)+' MB — clique ▶ para ouvir','success');
    showPlayer(blob,title);
  } catch(e) {
    setProgress(0);
    setStatus('Erro: '+e.message,'error');
    if(e.message.indexOf('401')>-1){localStorage.removeItem('r4m_key');showSetup();}
  } finally {
    $('btnUrl').disabled=false; $('btnPdf').disabled=false;
  }
}
</script>
</body>
</html>
